services:
  fcp-fd-file-processor:
    build:
      context: .
      target: production
    image: fcp-fd-file-processor
    depends_on:
      - fcp-fd-file-processor-azurite
    container_name: fcp-fd-file-processor
    environment:
      APPINSIGHTS_CLOUDROLE: fcp-fd-file-processor-local
      APPINSIGHTS_CONNECTIONSTRING: ${APPINSIGHTS_CONNECTIONSTRING}
      MESSAGE_QUEUE_HOST: ${MESSAGE_QUEUE_HOST}
      MESSAGE_QUEUE_USER: ${MESSAGE_QUEUE_USER}
      MESSAGE_QUEUE_PASSWORD: ${MESSAGE_QUEUE_PASSWORD}
      DATA_TOPIC_ADDRESS: fcp-fd-data${MESSAGE_QUEUE_SUFFIX}

  fcp-fd-file-processor-azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: fcp-fd-file-processor-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
