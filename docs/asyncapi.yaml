asyncapi: 3.0.0
info:
  title: FCP FD File Processor
  version: 1.0.0
  description: Handles file uploads with metadata for the fcp-fd-file-processor microservice.

channels:
  fcp-fd-file-upload:
    address: fcp-fd-file-upload
    description: |
      Accepts file upload requests with metadata via HTTP using the form-data method.
    messages:
      fileUploadMessage:
        $ref: '#/components/messages/fileUploadMessage'

operations:
  fcp-fd-file-upload.send:
    action: send
    channel:
      $ref: '#/channels/fcp-fd-file-upload'

components:
  messages:
    fileUploadMessage:
      name: File Upload Message
      contentType: multipart/form-data
      payload:
        $ref: '#/components/schemas/fileUploadSchema'

  schemas:
    fileUploadSchema:
      type: object
      description: File upload schema combining file and metadata.
      additionalProperties: false
      required:
        - file
        - metadata
      properties:
        file:
          $ref: '#/components/schemas/fileObject'
        metadata:
          $ref: '#/components/schemas/metadataObject'

    fileObject:
      type: string
      format: binary
      description: File object to be uploaded. Allowed extensions - PDF.
      example: (binary data representing a PDF file)

    metadataObject:
      type: object
      description: JSON object containing user-provided key-value metadata.
      additionalProperties: true
      example:
        documentType: "invoice"
        uploadedBy: "user123"
        timestamp: "2024-06-17T12:34:56Z"